<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;background:#fff;border-radius:12px;border:1px solid #e6e0dc;overflow:hidden;display:flex;flex-direction:column;height:100%">
  <div style="position:relative;height:108px;background:{{ item.thumbBg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden">
    <img src="assets/momentus-star-white.png" alt="" style="position:absolute;right:-28px;bottom:-38px;width:128px;opacity:0.12;z-index:0" />
    <img src="assets/momentus-star-white.png" alt="" style="position:absolute;left:-22px;top:-28px;width:84px;opacity:0.07;z-index:0" />
    <img src="assets/momentus-logo-white.png" alt="Momentus" style="height:15px;z-index:1;display:block" />
    <span style="font-size:8px;font-weight:700;letter-spacing:1.6px;color:{{ item.thumbLabelColor }};z-index:1">{{ item.thumbLabel }}</span>
  </div>
  <sc-if value="{{ item.showProgress }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:8px;padding:9px 12px 0">
      <div style="flex:1;height:5px;border-radius:99px;background:#e6e0dc;overflow:hidden">
        <div style="height:100%;background:#4146e0;width:{{ item.progress }}%"></div>
      </div>
      <span style="font-size:11px;color:#7a7690;flex-shrink:0">{{ item.progress }}%</span>
    </div>
  </sc-if>
  <div style="padding:12px;flex:1;display:flex;flex-direction:column">
    <div style="font-size:13px;font-weight:700;line-height:1.3;color:#1c1e61;min-height:34px">{{ item.title }}</div>
    <div style="display:flex;align-items:center;gap:7px;margin-top:12px">
      <div style="width:22px;height:22px;border-radius:50%;background:{{ item.authorColor }};color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{ item.authorInitials }}</div>
      <span style="font-size:11px;color:#7a7690;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ item.authorName }}</span>
      <span style="display:flex;align-items:center;gap:3px;font-size:11px;color:#7a7690;flex-shrink:0">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        {{ item.views }}
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:216,&quot;height&quot;:210},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
