  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

color: #1c1e61; background: #e9e5e1; -webkit-font-smoothing: antialiased; }\n  a { color: #4146e0; text-decoration: none; }\n  a:hover { color: #9B59B6; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;padding:24px 16px 60px\">\n  <!-- EMAIL SHELL -->\n  <div style=\"max-width:640px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(28,30,97,0.18)\">\n    <!-- header -->\n    <div style=\"position:relative;background:linear-gradient(120deg,#1c1e61,#4146e0 60%,#9B59B6);padding:26px 32px;overflow:hidden\">\n      <img src=\"722a33c9-27da-4649-bd0b-96236d377c92\" alt=\"\" style=\"position:absolute;right:-24px;top:-20px;width:150px;opacity:0.14;pointer-events:none\">\n      <img src=\"7f3c9720-15e0-4d76-9489-3466a4ccd8f1\" alt=\"Momentus Technologies\" style=\"height:24px;display:block;position:relative;z-index:1\">\n      <div style=\"position:relative;z-index:1;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.85)\">{{ kicker }}<\u002Fdiv>\n      <div style=\"position:relative;z-index:1;font-size:26px;font-weight:800;color:#fff;line-height:1.15;margin-top:4px\">{{ heroTitle }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- INSTANT -->\n    <sc-if value=\"{{ showInstant }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:28px 32px 12px\">\n        <div style=\"font-size:15px;color:#555770;line-height:1.6\">Hi Sam — something new was just curated for you in the Momentus Customer Hub.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:8px 32px 4px\">\n        <div style=\"border:1px solid #e6e0dc;border-radius:14px;overflow:hidden\">\n          <div style=\"height:96px;background:linear-gradient(120deg,#4146E0,#9B59B6);display:flex;align-items:center;padding:0 22px\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.22);color:#fff;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700\"><i>★<\u002Fi> Product Release<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px\">\n            <div style=\"font-size:12px;color:#9a96a8;font-weight:600;margin-bottom:6px\">July 8, 2026<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:800;color:#1c1e61;line-height:1.25;margin-bottom:8px\">Momentus Elite 2026.2 is now available<\u002Fdiv>\n            <div style=\"font-size:14px;color:#555770;line-height:1.6;margin-bottom:18px\">The summer release introduces the Integrated Payments dashboard, faster calendar sync, and 20+ reporting improvements across your venue operations.<\u002Fdiv>\n            <a href=\"#\" style=\"display:inline-block;background:#4146e0;color:#fff;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700\">Read the release notes →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 32px 8px\">\n        <div style=\"font-size:13px;color:#8b8798;line-height:1.6\">You're receiving this because you subscribed to <strong style=\"color:#1c1e61\">Instant<\u002Fstrong> updates. Prefer fewer emails? Switch to a Weekly or Monthly digest in your Hub subscription settings.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- WEEKLY -->\n    <sc-if value=\"{{ showWeekly }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 32px 6px\">\n        <div style=\"font-size:15px;color:#555770;line-height:1.6\">Here's everything curated for you in the last 7 days — {{ weekRange }}.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 32px 4px\">\n        <div style=\"font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#4146e0;margin-bottom:12px\">📣 New announcements<\u002Fdiv>\n        <sc-for list=\"{{ weekAnnouncements }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #f2f2f7\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:{{ a.accent }};margin-top:7px;flex-shrink:0\"><\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:{{ a.accent }};margin-bottom:2px\">{{ a.tag }}<\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:700;color:#1c1e61;line-height:1.3;margin-bottom:3px\">{{ a.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#68737d;line-height:1.5\">{{ a.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:20px 32px 4px\">\n        <div style=\"font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#6d5ef0;margin-bottom:12px\">✦ Recommended for you<\u002Fdiv>\n        <sc-for list=\"{{ weekRecs }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #f2f2f7\">\n            <div style=\"width:34px;height:34px;border-radius:9px;background:{{ r.accent }}18;color:{{ r.accent }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0\">{{ r.badge }}<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:15px;font-weight:700;color:#1c1e61;line-height:1.3\">{{ r.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#68737d;line-height:1.5\">{{ r.reason }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:22px 32px 8px\">\n        <a href=\"#\" style=\"display:block;text-align:center;background:#4146e0;color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:700\">Open the Customer Hub →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- MONTHLY -->\n    <sc-if value=\"{{ showMonthly }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 32px 4px\">\n        <div style=\"font-size:15px;color:#555770;line-height:1.65\">Welcome to the {{ monthName }} edition of the Momentus Technologies Education &amp; Community Digest! Explore the latest product education, resources, community highlights, and upcoming events designed to help you get the most from your Momentus experience.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:8px 32px 0\">\n        <sc-for list=\"{{ monthlySections }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"border-top:2px solid #f2f2f7;padding:22px 0 6px\">\n            <div style=\"font-size:18px;font-weight:800;color:#1c1e61;margin-bottom:14px\">{{ s.heading }}<\u002Fdiv>\n            <sc-for list=\"{{ s.items }}\" as=\"i\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:14px;margin-bottom:16px\">\n                <div style=\"width:44px;height:44px;border-radius:11px;background:{{ i.bg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0\">{{ i.emoji }}<\u002Fdiv>\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;font-weight:700;color:#1c1e61;line-height:1.3;margin-bottom:3px\">{{ i.title }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#68737d;line-height:1.55;margin-bottom:5px\">{{ i.body }}<\u002Fdiv>\n                  <a href=\"#\" style=\"font-size:13px;font-weight:700;color:#4146e0\">{{ i.cta }} →<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- footer -->\n    <div style=\"background:#1c1e61;padding:24px 32px;margin-top:18px\">\n      <img src=\"7f3c9720-15e0-4d76-9489-3466a4ccd8f1\" alt=\"Momentus Technologies\" style=\"height:18px;display:block;opacity:0.9\">\n      <div style=\"font-size:12px;color:rgba(255,255,255,0.6);line-height:1.6;margin-top:12px\">You're receiving the {{ freqLabel }} from the Momentus Customer Hub. <a href=\"#\" style=\"color:#cfd4ff\">Manage your subscription<\u002Fa> · <a href=\"#\" style=\"color:#cfd4ff\">Unsubscribe<\u002Fa><\u002Fdiv>\n      <div style=\"font-size:11px;color:rgba(255,255,255,0.45);margin-top:10px\">© 2026 Momentus Technologies<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'instant' };\n\n  weekAnnouncements = [\n    { tag: 'Product Release', accent: '#4146e0', title: 'Momentus Elite 2026.2 is now available', body: 'Integrated Payments dashboard, faster calendar sync, and 20+ reporting improvements.' },\n    { tag: 'New Support Workflow', accent: '#1c1e61', title: 'Submit and track tickets from the hub', body: 'Open a case, attach files, and follow status without leaving Momentus.' },\n  ];\n  weekRecs = [\n    { badge: 'C', accent: '#4146e0', title: 'Event Booking & Space Management', reason: 'Continue where you left off — 72% complete.' },\n    { badge: 'F', accent: '#1c1e61', title: 'Try Functions to automate billing', reason: 'Low adoption on your account — teams save ~4 hrs/week.' },\n    { badge: 'M', accent: '#9B59B6', title: 'Share your favorite product tip', reason: 'Popular mission this week — earn 100 points.' },\n  ];\n\n  monthlySections = [\n    { heading: 'Upcoming Webinars', items: [\n      { emoji: '🎥', bg: 'linear-gradient(135deg,#4146e0,#6d5ef0)', title: 'Momentus AI for Sales — Product Preview', body: 'July 15 at 9:00 AM CDT. A sneak peek at AI that helps qualify leads and build revenue-capturing proposals.', cta: 'Register' },\n      { emoji: '🚀', bg: 'linear-gradient(135deg,#1c1e61,#4146e0)', title: 'Elite July 2026 Product Release', body: 'July 23 at 9:00 AM CDT. A first look at the latest enhancements in the July release.', cta: 'Register' },\n    ] },\n    { heading: 'On-Demand: Elite Live Q&A', items: [\n      { emoji: '▶️', bg: 'linear-gradient(135deg,#9B59B6,#db2777)', title: 'Missed our June Elite Live Q&A?', body: 'Watch the recording for answers to real customer questions, common use cases, and best practices.', cta: 'Watch the recording' },\n    ] },\n    { heading: 'In the Community', items: [\n      { emoji: '⚽', bg: 'linear-gradient(135deg,#059669,#2dd4bf)', title: 'World Cup Missions — now through July 20', body: 'Over 80% of World Cup stadiums run on Momentus. Earn 100 points each for sharing your photos, stories, and predictions.', cta: 'Go to missions' },\n    ] },\n    { heading: 'In the Learning Center', items: [\n      { emoji: '🎓', bg: 'linear-gradient(135deg,#db2777,#f79a3e)', title: 'NEW — Functions Tips & Tricks', body: 'See how Wisconsin Center District, Pittsburgh Cultural Trust, and Overture Center use Functions to streamline operations.', cta: 'Start learning' },\n    ] },\n    { heading: 'All Resources', items: [\n      { emoji: '💬', bg: 'linear-gradient(135deg,#4146e0,#9B59B6)', title: 'Customer Community', body: 'Connect with peers, share best practices, complete missions and earn rewards.', cta: 'Visit the Community' },\n      { emoji: '📅', bg: 'linear-gradient(135deg,#1c1e61,#4146e0)', title: 'Monthly Webinar Series', body: 'Live sessions, product release updates, training, and roundtable discussions with peers.', cta: 'View webinars' },\n    ] },\n  ];\n\n  renderVals() {\n    const v = this.state.view;\n    const mkTab = (id) => {\n      const on = v === id;\n      return { flex: '1', border: 'none', borderRadius: '9px', padding: '11px', fontSize: '13px', fontWeight: 700, cursor: 'pointer', background: on ? '#4146e0' : 'transparent', color: on ? '#fff' : '#68737d' };\n    };\n    const meta = {\n      instant: { kicker: 'Instant Update', heroTitle: 'Something new for you', freqLabel: 'Instant updates' },\n      weekly: { kicker: 'Weekly Digest', heroTitle: 'Your weekly roundup', freqLabel: 'Weekly Digest' },\n      monthly: { kicker: 'Monthly Digest', heroTitle: 'June 2026 Digest', freqLabel: 'Monthly Digest' },\n    }[v];\n    return {\n      goInstant: () => this.setState({ view: 'instant' }),\n      goWeekly: () => this.setState({ view: 'weekly' }),\n      goMonthly: () => this.setState({ view: 'monthly' }),\n      tab: { instant: mkTab('instant'), weekly: mkTab('weekly'), monthly: mkTab('monthly') },\n      showInstant: v === 'instant',\n      showWeekly: v === 'weekly',\n      showMonthly: v === 'monthly',\n      kicker: meta.kicker,\n      heroTitle: meta.heroTitle,\n      freqLabel: meta.freqLabel,\n      weekRange: 'Jul 3–9, 2026',\n      monthName: 'June',\n      weekAnnouncements: this.weekAnnouncements,\n      weekRecs: this.weekRecs,\n      monthlySections: this.monthlySections,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
